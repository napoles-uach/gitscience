name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[testing,quality]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
