[project]
name = "gitscience"
version = "0.1.0"
description = "Git-backed scientific claims with reproducible computational evidence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["open-science", "reproducibility", "kwant", "lean", "git"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
testing = ["pytest>=8.0"]
quality = ["ruff>=0.15.12"]

[project.scripts]
gitscience = "gitscience.cli:entrypoint"

[project.entry-points."gitscience.verifiers"]
fmm_occupancy = "gitscience_fmm.plugin:plugin"
kwant_transport = "gitscience_kwant.plugin:plugin"
lean_formal = "gitscience_lean.plugin:plugin"

[project.entry-points."gitscience.reviewers"]
physics_intern = "gitscience_physics_intern.plugin:plugin"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "gitscience",
    "gitscience_fmm",
    "gitscience_kwant",
    "gitscience_lean",
    "gitscience_physics_intern",
]

[tool.setuptools.package-data]
gitscience_lean = ["proofs/*.lean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
branch = true
source = [
    "gitscience",
    "gitscience_fmm",
    "gitscience_kwant",
    "gitscience_lean",
    "gitscience_physics_intern",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
