kind: lemma
title: Scattering covariance implies even transmission
statement:
  natural_language: |
    If scattering is covariant under twist reversal and transmission is
    invariant under that covariance map, total transmission is even in twist.
  latex: |
    \left[\mathcal S_{-\tau}=\Phi(\mathcal S_\tau)\ \land\
    \mathcal T\circ\Phi=\mathcal T\right]
    \Longrightarrow T(E,-\tau)=T(E,\tau).
