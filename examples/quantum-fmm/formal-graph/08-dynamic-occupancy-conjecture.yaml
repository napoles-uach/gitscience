kind: conjecture
study: quantum-fmm
role: open_question
title: Kinetic evolution admits a useful occupancy-tail bound
question: Can occupancy overflow be controlled throughout kinetic evolution from accessible initial data?
plain_language_conclusion: No such bound is established; the desired relationship is recorded as an open conjecture.
scope_summary: The conjecture targets general kinetic evolution in the declared occupancy model.
remaining_uncertainty: The kinetic operator need not preserve the capacity-limited subspace.
statement:
  natural_language: |
    Seek a bound on bad-box probability throughout kinetic evolution using
    initial occupancy, kinetic energy, time, capacity, and box scale.
  latex: |
    p_{\rm bad}(t)\le
    F\!\left(p_{\rm bad}(0),\langle T\rangle,t,c,h\right).
topic: QF
model: quantum-fmm-occupancy-v1
scope: general
depends_on:
  - GS-QF-0001
  - GS-QF-0004
limitations:
  - The kinetic operator generally does not commute with Pi_c.
  - No such bound is proved in this case study.
